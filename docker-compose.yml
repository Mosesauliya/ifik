services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ci3_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - ci3_network

  db:
    image: mysql:8.0
    container_name: ci3_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_ifik
      MYSQL_USER: ci3_user
      MYSQL_PASSWORD: ci3_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ci3_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ci3_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - ci3_network

networks:
  ci3_network:
    driver: bridge

volumes:
  db_data:
